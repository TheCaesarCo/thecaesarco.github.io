<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Console — Caesar Co.</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0a;
    color: #f5f5f7;
    min-height: 100vh;
  }
  header {
    padding: 20px 40px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 1.2rem; font-weight: 600; }
  header button {
    background: transparent;
    color: #f5f5f7;
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  main { max-width: 720px; margin: 0 auto; padding: 60px 24px; }
  h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 24px; letter-spacing: -0.02em; }
  .card {
    background: #161616;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 28px;
  }
  label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: rgba(245,245,247,0.75); }
  input, textarea, select {
    width: 100%;
    background: #0a0a0a;
    color: #f5f5f7;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    margin-bottom: 16px;
  }
  textarea { min-height: 100px; resize: vertical; }
  button.primary {
    width: 100%;
    background: #f5f5f7;
    color: #0a0a0a;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .msg { margin-top: 14px; font-size: 0.88rem; }
  .msg.error { color: #ff6b6b; }
  .msg.success { color: #4ade80; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <h1>Caesar Co. — Admin</h1>
    <button id="logoutBtn" class="hidden">Sign out</button>
  </header>
  <main>
    <!-- LOGIN -->
    <section id="loginView">
      <h2>Admin Sign In</h2>
      <div class="card">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
        <label>Password</label>
        <input type="password" id="password" />
        <button class="primary" id="loginBtn">Sign in</button>
        <div id="loginMsg" class="msg"></div>
      </div>
    </section>

    <!-- UPLOAD -->
    <section id="uploadView" class="hidden">
      <h2>Add a Car Project</h2>
      <div class="card">
        <label>Title</label>
        <input type="text" id="title" />
        <label>Car type</label>
        <select id="carType">
          <option>Sedan</option>
          <option>SUV</option>
          <option>Truck</option>
          <option>Sports</option>
          <option>Classic</option>
          <option>Other</option>
        </select>
        <label>Description</label>
        <textarea id="description"></textarea>
        <label>Cover photo URL</label>
        <input type="url" id="coverPhoto" placeholder="https://…" />
        <label>YouTube URL (optional)</label>
        <input type="url" id="youtubeUrl" placeholder="https://youtube.com/…" />
        <button class="primary" id="saveBtn">Save project</button>
        <div id="saveMsg" class="msg"></div>
      </div>
    </section>
  </main>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  const SUPABASE_URL = "https://fhhdmaawmsrlcctfvmpk.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoaGRtYWF3bXNybGNjdGZ2bXBrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczODU4NDgsImV4cCI6MjA5Mjk2MTg0OH0.7PlxLyZuR9zBZOiEUrpysKcYtrKzpjcuehDI_w0OmJs";
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginView  = document.getElementById("loginView");
  const uploadView = document.getElementById("uploadView");
  const logoutBtn  = document.getElementById("logoutBtn");
  const loginMsg   = document.getElementById("loginMsg");
  const saveMsg    = document.getElementById("saveMsg");

  async function checkAdmin() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return showLogin();
    const { data, error } = await supabase
      .from("user_roles")
      .select("role")
      .eq("user_id", user.id)
      .eq("role", "admin")
      .maybeSingle();
    if (error || !data) {
      await supabase.auth.signOut();
      loginMsg.className = "msg error";
      loginMsg.textContent = "This account doesn't have admin access.";
      return showLogin();
    }
    showUpload();
  }

  function showLogin()  { loginView.classList.remove("hidden"); uploadView.classList.add("hidden"); logoutBtn.classList.add("hidden"); }
  function showUpload() { loginView.classList.add("hidden");    uploadView.classList.remove("hidden"); logoutBtn.classList.remove("hidden"); }

  document.getElementById("loginBtn").addEventListener("click", async () => {
    loginMsg.textContent = "";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { loginMsg.className = "msg error"; loginMsg.textContent = error.message; return; }
    checkAdmin();
  });

  logoutBtn.addEventListener("click", async () => {
    await supabase.auth.signOut();
    showLogin();
  });

  document.getElementById("saveBtn").addEventListener("click", async () => {
    saveMsg.textContent = "";
    const payload = {
      title:       document.getElementById("title").value.trim(),
      car_type:    document.getElementById("carType").value,
      description: document.getElementById("description").value.trim(),
      cover_photo: document.getElementById("coverPhoto").value.trim() || null,
      youtube_url: document.getElementById("youtubeUrl").value.trim() || null,
      photos: [],
    };
    if (!payload.title) { saveMsg.className = "msg error"; saveMsg.textContent = "Title is required."; return; }
    const { error } = await supabase.from("car_projects").insert(payload);
    if (error) { saveMsg.className = "msg error"; saveMsg.textContent = error.message; return; }
    saveMsg.className = "msg success";
    saveMsg.textContent = "Project saved!";
    document.getElementById("title").value = "";
    document.getElementById("description").value = "";
    document.getElementById("coverPhoto").value = "";
    document.getElementById("youtubeUrl").value = "";
  });

  checkAdmin();
</script>
</body>
</html>
